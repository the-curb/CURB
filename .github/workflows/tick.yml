# The scheduler, deliberately outside the hosting platform.
#
# A platform cron that quietly degrades — to once a day, or to nothing — is
# indistinguishable from an agent that had nothing to say, which is the one
# confusion this system exists to remove. GitHub's scheduler is a separate
# machine on a separate provider; if it stops, the Warden's "agents reporting
# in the last hour" goes to zero and says so.
#
# Required repository secrets:
#   CURB_TICK_URL     https://<your deployment>/api/tick
#   CURB_TICK_SECRET  the same value as the deployment's CURB_TICK_SECRET
#
# GitHub's cron is best-effort and can run minutes late under load. That is
# fine: each agent decides its own due-ness from its last heartbeat, so a late
# tick runs what is due and a doubled tick is refused by the run lock.

name: tick

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      dry:
        description: 'Rehearse without writing (dry run)'
        type: boolean
        default: false
      daily:
        description: 'Run the position product’s daily evidence and verification now (after a source was added)'
        type: boolean
        default: false

concurrency:
  group: tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Call /api/tick
        env:
          URL: ${{ secrets.CURB_TICK_URL }}
          SECRET: ${{ secrets.CURB_TICK_SECRET }}
          DRY: ${{ inputs.dry && '?dry=1' || (inputs.daily && '?daily=force') || '' }}
        run: |
          set -euo pipefail
          if [ -z "$URL" ] || [ -z "$SECRET" ]; then
            echo "CURB_TICK_URL and CURB_TICK_SECRET must be set as repository secrets." >&2
            exit 1
          fi
          # A non-2xx is a failure worth a red run; the body says which agent and why.
          curl --fail-with-body --silent --show-error --max-time 840 \
            -X POST "${URL}${DRY}" \
            -H "Authorization: Bearer ${SECRET}" \
            | tee tick.json
          # Surface the summary so a glance at the run log answers "what ran".
          node -e '
            const t = JSON.parse(require("fs").readFileSync("tick.json","utf8"));
            console.log("store:", t.store);
            console.log("lock :", t.lock?.state, t.lock?.renewalFault ? "RENEWAL FAULT: "+t.lock.renewalFault : "");
            for (const r of t.ran) console.log(" ", r.agentId.padEnd(10), r.outcome.padEnd(22), JSON.stringify(r.storage));
            const red = (why) => { console.log("RED:", why); process.exitCode = 1; };
            if (t.undetermined?.length) red("UNDETERMINED " + JSON.stringify(t.undetermined));
            if (t.alerts) console.log("alerts:", t.alerts.delivery.state, "raised", t.alerts.raised.length, "cleared", t.alerts.cleared.length, "active", t.alerts.active.length);
            if (t.alerts && t.alerts.delivery.state === "FAILED") red("alert delivery FAILED: " + (t.alerts.delivery.reason ?? ""));
            if (t.retention) console.log("retention:", t.retention.state, t.retention.removed ?? "");
            if (t.retention && (t.retention.state === "UNCONFIRMED" || t.retention.state === "STATE_UNREADABLE")) red("retention " + t.retention.state + ": " + (t.retention.reason ?? ""));
            for (const r of t.ran || []) if (r.persisted && r.storage && r.storage.state === "FAILED") red("agent " + r.agentId + " ran but its record was not written: " + (r.storage.reason ?? ""));
            if (t.maintenance) console.log("maintenance:", t.maintenance.state, t.maintenance.detail ?? "");
            if (t.maintenance && t.maintenance.state === "SKIPPED") red("maintenance SKIPPED: " + (t.maintenance.detail ?? ""));
            if (t.credits) console.log("credits:", t.credits.state, "rate", t.credits.rate?.state, "code", t.credits.code?.state, "index", t.credits.index?.state, t.credits.index?.detail ?? "");
            if (t.credits && t.credits.state === "CONFIGURED" && t.credits.index && ["HELD", "STORE_UNREADABLE", "HEAD_UNREAD"].includes(t.credits.index.state)) red("credits index " + t.credits.index.state + ": " + (t.credits.index.detail ?? ""));
            if (t.credits && t.credits.state === "FAILED") red("credits run FAILED: " + (t.credits.detail ?? ""));
            if (t.positions) console.log("positions:", JSON.stringify(t.positions).slice(0, 300));
            if (t.positions && t.positions.daily && t.positions.daily.state === "STATE_UNREADABLE") red("positions daily run: the store did not answer (" + (t.positions.daily.detail ?? "") + ")");
            for (const s of (t.positions && t.positions.series) || []) if (s.sync && (s.sync.state === "STORE_UNREADABLE" || s.sync.state === "HEAD_UNREAD")) red("positions series " + s.seriesId + " sync " + s.sync.state + ": " + (s.sync.detail ?? ""));
            if (t.narration && t.narration.state === "ATTEMPTED") console.log("narration:", t.narration.record.outcome, t.narration.record.detail ?? "");
            if (!t.store || !t.store.startsWith("postgres")) red("the tick wrote to " + (t.store ?? "a store it did not name") + ", not postgres: a filesystem store on a container is lost at the next deploy");
            if (t.narration && t.narration.state === "ATTEMPTED" && t.narration.record && t.narration.record.outcome !== "NARRATED") red("narration " + t.narration.record.outcome + ": " + (t.narration.record.detail ?? "").slice(0, 200));
            if (t.storeSchema) console.log("schema:", t.storeSchema.state, t.storeSchema.detail ?? "");
            if (t.storeSchema && t.storeSchema.state !== "CURRENT") red("store schema " + t.storeSchema.state + ": " + (t.storeSchema.detail ?? ""));
          '
