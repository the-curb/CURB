# Uses the same read-only probe that an operator can run outside GitHub.
# Tick and watch still share GitHub's scheduler; this does not establish that
# any monitor on a separate platform has been installed or is active.
name: watch

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Read and assess /api/state
        env:
          # Converts the existing /api/tick path to /api/state. Never interpolate
          # the URL into shell source or print it.
          CURB_HEALTH_URL: ${{ secrets.CURB_TICK_URL }}
        run: node scripts/check-health.ts
