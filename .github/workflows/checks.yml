# The checks: the site's types, tests and build; the contract's compile and
# unit tests. Every push and pull request, so a change that breaks either is
# named before it is deployed — Vercel builds the site on push regardless,
# and a failed check here is the earlier, louder warning.
#
# The fork tests are not here: they read Ethereum and run in the weekly
# fork-evidence workflow, with their findings committed. The local-chain
# rehearsal and drill are: a Hardhat node is started, the worked example, the
# incidents, two top-ups of the credit desk, a 2-of-3 Safe (with Safe's code as
# Robinhood Chain has it) paying from the treasury, and the token read into a
# record and the desk deployed through the operator's tools are sent as
# transactions, and the site reads them back.

name: checks

on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    name: site · tsc, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The complete test suite exercises operator tools and the generated contract ABI.
      - run: npm ci
        working-directory: contracts
      - run: npm run build
        working-directory: contracts
      - run: npx next typegen
      - run: npx tsc --noEmit -p .
      - run: npm test
      - run: npx next build
        env:
          CURB_NETWORK: robinhood-mainnet

  store:
    name: store · Postgres conformance
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: curb
          POSTGRES_DB: curb
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The suite builds its tables in its own schema and drops it after; a disposable database here, never the production one.
      - name: The Postgres store against the shared contract
        env:
          # sslmode declared: the store encrypts unless the URL says otherwise, and a container's Postgres speaks plain.
          CURB_POSTGRES_URL: postgres://postgres:curb@localhost:5432/curb?sslmode=disable
        run: node --test tests/store-postgres.test.ts

  contracts:
    name: contracts · compile, unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          # Build provenance names the last source/compiler commit, not the checkout tip.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: The committed build records are this source's bytecode
        run: node scripts/check-build-record.mjs
      - run: npm test

  rehearsal:
    name: local chain · rehearsal, drill, index, reconciliation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm ci
        working-directory: contracts
      - run: npm run build
        working-directory: contracts
      - name: Start a Hardhat node
        working-directory: contracts
        run: |
          (npx hardhat node > node.log 2>&1 &)
          for i in $(seq 1 30); do
            if curl -s -X POST -H 'content-type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' http://127.0.0.1:8545 | grep -q 0x7a69; then exit 0; fi
            sleep 1
          done
          echo "the node did not answer"; tail -20 node.log; exit 1
      # The committed build records are what the site verifies against; the bytecode carries
      # no metadata hash, so this compile is the same bytes, and the contracts job checks it.
      - name: The committed build records are this source's bytes
        working-directory: contracts
        run: node scripts/check-build-record.mjs
      - name: Deploy the series and run the worked example and the drill as transactions
        working-directory: contracts
        run: |
          node scripts/rehearsal.ts > rehearsal.json
          node scripts/drill.ts > drill.json
          node scripts/credits-rehearsal.ts > credits-rehearsal.json
      - name: The operator's multisig, with Safe's code from Robinhood Chain, and the token read into a record and the desk deployed through the tools
        working-directory: contracts
        env:
          # Hardhat's well-known local test key; chain 31337 only, never a key that matters.
          DEPLOYER_PRIVATE_KEY: '0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80'
        run: |
          node scripts/safe-rehearsal.ts > safe-rehearsal.json
          # The Safe planner's --send, the way the operator will run it: a 2-of-3 Safe created on the local chain, read back and recorded.
          node scripts/plan-safe.ts 0x70997970C51812dc3A010C7d01b50e0d17dc79C8 0x3C44CdDdB6a900fa2b585dd299e03d12FA4293BC 0x90F79bf6EB2c4f870365E785982E1f101E93b906 --network hardhat-local --send > safe-created.json
          node -e "const s=require('./safe-created.json');console.log('Safe created through the planner at', s.safe, 'owners', s.owners.length, 'threshold', s.threshold)"
          TOKEN=$(node -e "console.log(require('./credits-rehearsal.json').credits.token)")
          TREAS=$(node -e "console.log(require('./credits-rehearsal.json').treasury)")
          PAIR=$(node -e "console.log(require('./credits-rehearsal.json').credits.priceSource.pair)")
          node scripts/record-token.ts "$TOKEN" --network hardhat-local --treasury "$TREAS" --out records/credit-desk.31337.json > /dev/null
          node -e "const fs=require('fs');const p='records/credit-desk.31337.json';const r=JSON.parse(fs.readFileSync(p,'utf8'));r.priceSource={kind:'uniswap-v2-pair',pair:process.argv[1],quote:{kind:'usd-stable'}};r.reviewedBy='rehearsal stand-in (local chain 31337, mock token) - not a review';r.reviewedAt=new Date().toISOString();fs.writeFileSync(p,JSON.stringify(r,null,2)+'\n');" "$PAIR"
          node scripts/deploy-credit-desk.ts records/credit-desk.31337.json --dry-run > /dev/null
          node scripts/deploy-credit-desk.ts records/credit-desk.31337.json > desk-env.json
          # The series deployment tool, the same way: a record written from the rehearsal's mock components, a stand-in review, a dry run, a deployment.
          node -e "const fs=require('fs');const r=require('./rehearsal.json')['apple-s1'];const rec={seriesId:'apple-s1',chainId:31337,rpcUrl:'http://127.0.0.1:8545',components:r.components,decimals:{A:18,B:18},q:r.q,capLots:r.capLots,operator:process.argv[1],name:'Apple Position - Series 1 (tool rehearsal)',symbol:'cAAPL-S1',reviewedBy:'rehearsal stand-in (local chain 31337, mock components) - not a review',reviewedAt:new Date().toISOString()};fs.mkdirSync('records',{recursive:true});fs.writeFileSync('records/apple-s1.31337.json',JSON.stringify(rec,null,2)+'\n');" "$TREAS"
          node scripts/deploy-series.ts records/apple-s1.31337.json --dry-run > /dev/null
          node scripts/deploy-series.ts records/apple-s1.31337.json > series-env.json
          node -e "const e=require('./series-env.json');console.log('series deployed through the tool at', Object.values(e)[0].address)"
          node -e "const s=require('./safe-rehearsal.json');console.log('Safe', s.safe, 'payment executed in block', s.executedInBlock, 'refusals', JSON.stringify(s.refused))"
      - name: Safe operator verification, two-step acceptance and deployment journal
        working-directory: contracts
        env:
          REHEARSAL_RPC_URL: http://127.0.0.1:8545
        run: node scripts/series-preflight-rehearsal.ts > series-preflight-rehearsal.json
      - name: Read them back through the site's index, reconciliation, conditions, prepared calldata and the credit desk
        run: |
          CURB_REHEARSAL_DEPLOYMENTS="$(cat contracts/rehearsal.json)" CURB_DRILL_RECORD="$(cat contracts/drill.json)" CURB_REHEARSAL_CREDITS="$(cat contracts/credits-rehearsal.json)" CURB_REHEARSAL_DESK_ENV="$(cat contracts/desk-env.json)" node --test tests/positions-rehearsal.test.ts tests/positions-drill.test.ts tests/credits-rehearsal.test.ts tests/credits-tool-rehearsal.test.ts
      - name: The drill's record, as the test wrote it (not committed from here)
        run: node -e 'const d=require("./contracts/evidence/drill-local.json");console.log(d.ranAt, d.siteFindings.map(f=>f.scenario).join(" | "))'
      # Repeat the complete suite after the shared-node rehearsals, with generated artifacts present.
      - name: The whole site suite, artifacts present
        run: npm test

  release-checks:
    name: release checks
    if: always()
    needs: [site, store, contracts, rehearsal]
    runs-on: ubuntu-latest
    steps:
      - name: Every required job passed for this commit
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          if [ "$RESULTS" != "success,success,success,success" ]; then
            echo "Required release checks did not all pass: $RESULTS"
            exit 1
          fi
          echo "All four checks passed. This does not approve a token launch or asset pilot."
